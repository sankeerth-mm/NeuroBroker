version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: neurobroker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neurobroker
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Docker Compose}"
      POSTGRES_DB: neurobroker_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurobroker -d neurobroker_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: neurobroker-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://neurobroker:${POSTGRES_PASSWORD}@postgres:5432/neurobroker_db"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY before starting Docker Compose}"
      VOLUNTEER_TOKEN: "${VOLUNTEER_TOKEN:?Set VOLUNTEER_TOKEN before starting Docker Compose}"
      ENVIRONMENT: "production"
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"
      HOST: "0.0.0.0"
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neurobroker-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
