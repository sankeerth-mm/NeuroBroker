version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: neurobroker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: neurobroker
      POSTGRES_PASSWORD: neurobroker_password_2026
      POSTGRES_DB: neurobroker_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neurobroker -d neurobroker_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: neurobroker-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+asyncpg://neurobroker:neurobroker_password_2026@postgres:5432/neurobroker_db"
      VOLUNTEER_TOKEN: "NB_VOLUNTEER_SECRET_2026"
      HOST: "0.0.0.0"
      PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neurobroker-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
